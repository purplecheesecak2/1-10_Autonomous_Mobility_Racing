; PlatformIO Project Configuration File
;
; ESP32 Motor Control for Autonomous Driving
; Upload this to ESP32 board

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    default
    time

; Libraries
lib_deps =
    madhephaestus/ESP32Servo@^1.2.1

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Uncomment to enable encoder feedback:
    ; -D USE_ENCODER_FEEDBACK

; Upload settings
upload_speed = 921600
